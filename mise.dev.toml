# Dev module, layered on top of mise.toml: toolchains, debuggers, language
# tooling for Kakoune, coding agents (OpenCode, pi; Claude Code as a runtime),
# and user services: OpenCode's server and its web GUI proxy, and SSH in
# (dropbear).
#	mise -E dev bootstrap
# (.miserc.local.toml can select it by default on a dev machine.)
# Sources live in dev/. Remove everything this module manages with
#	mise bootstrap unapply dev

# Runs after mise.toml's own post-dotfiles hook (hooks from each file add up).
[bootstrap.hooks]
post-dotfiles = "bash '{{ config_root }}/dev/post-dotfiles.sh'"

[bootstrap.packages]
"pacman:direnv" = "latest"
"pacman:just" = "latest"

# Kakoune as an IDE; kakrc uses each only when it's installed
"pacman:kakoune-lsp" = "latest"
"pacman:kak-tree-sitter" = "latest"	# sochinorth repo (built by GitHub Actions); grammars: ktsctl sync (post-dotfiles hook)

# dev (gcc, make, fakeroot, diffutils, patch are generic: makepkg needs them)
"pacman:git-filter-repo" = "latest"
"pacman:github-cli" = "latest"		# gh
"pacman:clang" = "latest"
"pacman:mingw-w64-gcc" = "latest"	# Windows cross-compiler
"pacman:cmake" = "latest"
"pacman:gdb" = "latest"
"pacman:lldb" = "latest"
"pacman:bun" = "latest"			# also runs pi, a bun global (post-dotfiles hook)
"pacman:python-pip" = "latest"
"pacman:bubblewrap" = "latest"		# bwrap: unprivileged namespace sandboxes, run by hand

# AI tools (cachyos repo). Claude Code is only a runtime: OpenCode's Claude
# Agent provider runs it, with OpenCode's tools and none of Claude Code's
# settings files, so there's no config for it here.
"pacman:opencode" = "latest"		# update with pacman, not `opencode upgrade`
"pacman:claude-code" = "latest"

# SSH into this box without root: dropbear as a user service (below)
"pacman:dropbear" = "latest"

# --- user services ------------------------------------------------------------

# Dropbear on :22222, as you (no root, so no other user's logins), keys only
# (-s), the host key generated on first start. It runs without a login session
# only with linger, which the post-dotfiles hook enables. Who may log in:
# ~/.ssh/authorized_keys (below).
[bootstrap.linux.systemd.units.dropbear]
description = "Dropbear SSH (user)"
exec_start_pre = ["/bin/sh -c 'test -f %h/.config/dropbear/hostkey_ed25519 || { mkdir -p %h/.config/dropbear && dropbearkey -t ed25519 -f %h/.config/dropbear/hostkey_ed25519; }'"]
exec_start = "/usr/bin/dropbear -F -E -s -p 22222 -r %h/.config/dropbear/hostkey_ed25519 -P %t/dropbear.pid"
restart = "on-failure"

# OpenCode's background service, from boot rather than from whichever terminal
# first needs it. `opencode service start` forks the server and returns once it
# answers (a no-op when one already runs, which leaves this unit inactive). It
# runs through a login zsh so the server, and every command its agents run,
# gets a terminal's environment (PATH, EDITOR, ...), not the user manager's
# bare one. The server exits 130 on SIGTERM; a drop-in (below) counts that as
# success, which mise has no key for. No Restart=: `opencode service stop`
# means stopped, and opencode.web-gui starts it again when it's next needed.
[bootstrap.linux.systemd.units.opencode]
description = "OpenCode background service"
type = "forking"
exec_start = "/usr/bin/zsh -lic 'exec /usr/bin/opencode service start'"
timeout_start_sec = "90"

# OpenCode Web with GUI plugins, logged in, on http://127.0.0.1:44444
# (dev/opencode/web-gui.ts); it starts the service above when it's down.
[bootstrap.linux.systemd.units."opencode.web-gui"]
description = "OpenCode Web with GUI plugins (proxy on 127.0.0.1:44444)"
exec_start = "/usr/bin/bun {{ config_root }}/dev/opencode/web-gui.ts"
restart = "on-failure"
restart_sec = "5"

[dotfiles]
# bun's globals on PATH, and the pi alias (see the post-dotfiles hook)
"~/.config/zsh/conf.d/dev.zsh" = { source = "dev/zsh/dev.zsh", mode = "symlink" }
# OpenCode: the global config, instructions and plugins (codex.sale's live
# models, Claude's entrypoint environment, Claude transcript cleanup, session
# scratchpads, tool-call descriptions) are edited in place. cli.json is the
# TUI's to write (theme,
# settings), only seeded. Credentials, sessions and model picks live in its
# database (~/.local/share/opencode), not tracked; /connect them again.
"~/.config/opencode/opencode.json" = { source = "dev/opencode/opencode.json", mode = "symlink" }
"~/.config/opencode/plugins/codex-sale" = { source = "dev/opencode/plugins/codex-sale", mode = "symlink" }
"~/.config/opencode/plugins/claude-entrypoint" = { source = "dev/opencode/plugins/claude-entrypoint", mode = "symlink" }
"~/.config/opencode/plugins/claude-transcripts" = { source = "dev/opencode/plugins/claude-transcripts", mode = "symlink" }
"~/.config/opencode/plugins/scratchpad" = { source = "dev/opencode/plugins/scratchpad", mode = "symlink" }
"~/.config/opencode/plugins/tool-descriptions" = { source = "dev/opencode/plugins/tool-descriptions", mode = "symlink" }
"~/.config/opencode/cli.json/defaults" = { source = "dev/opencode/cli.json", merge = "missing" }
# Global instructions; OpenCode passes them to every provider, Claude Agent included.
"~/.config/opencode/AGENTS.md" = { source = "dev/opencode/AGENTS.md", mode = "symlink" }
# the opencode unit's exit status on SIGTERM (see the unit above)
"~/.config/systemd/user/dev.mise.opencode.service.d/success.conf" = { source = "dev/systemd/opencode-success.conf", mode = "symlink" }
# IDASQL: OpenCode uses each skill directory's basename as its ID, not the
# grouping directory or frontmatter name. Prefix the links to avoid collisions;
# keep upstream files and their relative reference paths intact.
"~/.config/opencode/skills/idasql-analysis" = { source = "dev/skills/idasql/plugins/idasql/skills/analysis", mode = "symlink" }
"~/.config/opencode/skills/idasql-annotations" = { source = "dev/skills/idasql/plugins/idasql/skills/annotations", mode = "symlink" }
"~/.config/opencode/skills/idasql-connect" = { source = "dev/skills/idasql/plugins/idasql/skills/connect", mode = "symlink" }
"~/.config/opencode/skills/idasql-data" = { source = "dev/skills/idasql/plugins/idasql/skills/data", mode = "symlink" }
"~/.config/opencode/skills/idasql-debugger" = { source = "dev/skills/idasql/plugins/idasql/skills/debugger", mode = "symlink" }
"~/.config/opencode/skills/idasql-decompiler" = { source = "dev/skills/idasql/plugins/idasql/skills/decompiler", mode = "symlink" }
"~/.config/opencode/skills/idasql-deep-links" = { source = "dev/skills/idasql/plugins/idasql/skills/deep-links", mode = "symlink" }
"~/.config/opencode/skills/idasql-disassembly" = { source = "dev/skills/idasql/plugins/idasql/skills/disassembly", mode = "symlink" }
"~/.config/opencode/skills/idasql-functions" = { source = "dev/skills/idasql/plugins/idasql/skills/functions", mode = "symlink" }
"~/.config/opencode/skills/idasql-grep" = { source = "dev/skills/idasql/plugins/idasql/skills/grep", mode = "symlink" }
"~/.config/opencode/skills/idasql-idapython" = { source = "dev/skills/idasql/plugins/idasql/skills/idapython", mode = "symlink" }
"~/.config/opencode/skills/idasql-re-source" = { source = "dev/skills/idasql/plugins/idasql/skills/re-source", mode = "symlink" }
"~/.config/opencode/skills/idasql-storage" = { source = "dev/skills/idasql/plugins/idasql/skills/storage", mode = "symlink" }
"~/.config/opencode/skills/idasql-types" = { source = "dev/skills/idasql/plugins/idasql/skills/types", mode = "symlink" }
"~/.config/opencode/skills/idasql-ui-context" = { source = "dev/skills/idasql/plugins/idasql/skills/ui-context", mode = "symlink" }
"~/.config/opencode/skills/idasql-xrefs" = { source = "dev/skills/idasql/plugins/idasql/skills/xrefs", mode = "symlink" }
# who may log in through dropbear (the phone); a copy at 0600, like ~/.ssh/config
"~/.ssh/authorized_keys" = { source = "dev/ssh/authorized_keys", mode = "copy", permissions = "0600" }
