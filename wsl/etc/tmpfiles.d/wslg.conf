# WSLg binds its X socket directory over /tmp/.X11-unix, and the X server
# listening on it lives in WSLg's own distro, out of sight of the in-use socket
# check: without this, x11.conf's 1h age would delete X0 from under it. The
# glob is what keeps the contents; x on the directory alone doesn't.
x /tmp/.X11-unix/*
