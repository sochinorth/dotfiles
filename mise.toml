# Generic Arch setup (Zen 4): CachyOS znver4 + Chaotic-AUR repos (+ my own sochinorth repo), doas
# with fudo standing in for sudo. Platform modules layer on top:
#   mise bootstrap            # this file only (+ whatever .miserc.local.toml selects)
#   mise -E wsl bootstrap     # + mise.wsl.toml
#
# Fresh machine: install-root.sh as root once, then as your user:
#   mise trust && mise [-E wsl] bootstrap
# See README.md for the order things happen in and why.

# --- hooks -------------------------------------------------------------------

[bootstrap.hooks]
# Repos, keys and fudo-git must exist before mise installs packages with `sudo`.
pre-packages = "bash '{{ config_root }}/scripts/pre-packages.sh'"
# Submodules (the Kakoune config, dotfiles/config/kak, is the kakmux repo;
# agent skills in dotfiles/skills): checked out here when the clone was made
# without --recurse-submodules. One already checked out is left alone (it's
# the live config, maybe ahead).
pre-dotfiles = """
cd '{{ config_root }}' || exit
if git submodule status | grep -q '^-'; then git submodule update --init; fi
"""
post-dotfiles = "bash '{{ config_root }}/scripts/post-dotfiles.sh'"

# --- packages ----------------------------------------------------------------
# Explicitly installed packages only; repo noted where it isn't the obvious one.
# Never add base-devel: it depends on real sudo, which conflicts with fudo-git.

[bootstrap.packages]
"pacman:base" = "latest"
"pacman:pacman-contrib" = "latest"
"pacman:man-db" = "latest"
"pacman:which" = "latest"

# repo plumbing (installed first by the pre-packages hook)
"pacman:cachyos-keyring" = "latest"
"pacman:cachyos-mirrorlist" = "latest"
"pacman:cachyos-v3-mirrorlist" = "latest"
"pacman:cachyos-v4-mirrorlist" = "latest"
"pacman:chaotic-keyring" = "latest"
"pacman:chaotic-mirrorlist" = "latest"
"pacman:paru" = "latest"              # cachyos; AUR helper behind mise's aur: manager
"pacman:opendoas" = "latest"          # pulled in by fudo-git, declared because everything hinges on it
# sudo -> doas shim. The pre-packages hook installs it (mise's own sudo calls
# need it first); declared here so status and `packages upgrade` cover it.
"aur:fudo-git" = "latest"

# shell
"pacman:zsh" = "latest"
"pacman:starship" = "latest"
"pacman:fzf" = "latest"
"pacman:zoxide" = "latest"
"pacman:direnv" = "latest"
"pacman:fortune-mod" = "latest"

# cli
"pacman:bat" = "latest"
"pacman:eza" = "latest"
"pacman:fd" = "latest"
"pacman:ripgrep" = "latest"         # kak global search (<space>/)
"pacman:sd" = "latest"
"pacman:jq" = "latest"
"pacman:xh" = "latest"
"pacman:dust" = "latest"
"pacman:duf" = "latest"
"pacman:procs" = "latest"
"pacman:btop" = "latest"
"pacman:broot" = "latest"
"pacman:walk" = "latest"              # chaotic-aur; used by lk() in .zshrc
"pacman:tealdeer" = "latest"
"pacman:just" = "latest"
"pacman:kakoune" = "latest"
"pacman:kakoune-lsp" = "latest"
"pacman:kak-tree-sitter" = "latest"   # sochinorth repo (built by GitHub Actions); grammars: ktsctl sync (post-dotfiles hook)
"pacman:tmux" = "latest"               # kakmux (~/.local/bin, the kakmux submodule): kak with a tmux-drawn bufferline; kakbr

# dev
"pacman:git" = "latest"
"pacman:git-delta" = "latest"
"pacman:git-filter-repo" = "latest"
"pacman:gcc" = "latest"
"pacman:clang" = "latest"
"pacman:mingw-w64-gcc" = "latest"     # Windows cross-compiler
"pacman:make" = "latest"
"pacman:cmake" = "latest"
"pacman:diffutils" = "latest"
"pacman:patch" = "latest"
"pacman:fakeroot" = "latest"
"pacman:gdb" = "latest"
"pacman:lldb" = "latest"
"pacman:strace" = "latest"
"pacman:bun" = "latest"
"pacman:mise" = "latest"

# net / sandboxing
"pacman:openssh" = "latest"
"pacman:socat" = "latest"
"pacman:tcpdump" = "latest"
"pacman:bubblewrap" = "latest"

# AI tools (cachyos repo)
"pacman:claude-code" = "latest"
"pacman:opencode" = "latest"

# --- system files (written through sudo = fudo -> doas) ----------------------

[bootstrap.files."/etc/pacman.conf"]
source = "files/etc/pacman.conf"
owner = "root"
group = "root"
mode = "0644"

[bootstrap.files."/etc/pacman.d/mirrorlist"]
source = "files/etc/pacman.d/mirrorlist"
owner = "root"
group = "root"
mode = "0644"

[bootstrap.files."/etc/doas.conf"]
source = "files/etc/doas.conf"
owner = "root"
group = "root"
mode = "0644"

[bootstrap.files."/etc/locale.conf"]
source = "files/etc/locale.conf"
owner = "root"
group = "root"
mode = "0644"

# --- dotfiles ----------------------------------------------------------------
# Edited-in-place configs are symlinks into this repo. Configs that their app
# rewrites are copies. Everything Kakoune (kak, kakbr, kakmux, broot-open) is
# in the kakmux submodule at dotfiles/config/kak.

[dotfiles]
"~/.zshrc" = { source = "dotfiles/zshrc", mode = "symlink" }
"~/.gitconfig" = { source = "dotfiles/gitconfig", mode = "symlink" }
"~/.config/git/ignore" = { source = "dotfiles/config/git/ignore", mode = "symlink" }
"~/.config/kak/kakrc" = { source = "dotfiles/config/kak/kakrc", mode = "symlink" }
"~/.config/kak/colors/onedark.kak" = { source = "dotfiles/config/kak/colors/onedark.kak", mode = "symlink" }
"~/.config/kak/kakmux.conf" = { source = "dotfiles/config/kak/kakmux.conf", mode = "symlink" }
"~/.config/kak/bin/kak-picker" = { source = "dotfiles/config/kak/bin/kak-picker", mode = "symlink" }
"~/.config/kak/bin/kakmux-even" = { source = "dotfiles/config/kak/bin/kakmux-even", mode = "symlink" }
"~/.config/kak/shell/kakmux.zsh" = { source = "dotfiles/config/kak/shell/kakmux.zsh", mode = "symlink" }
"~/.config/kakbr/kakbr.conf" = { source = "dotfiles/config/kak/kakbr/kakbr.conf", mode = "symlink" }
"~/.config/kakbr/broot.hjson" = { source = "dotfiles/config/kak/kakbr/broot.hjson", mode = "symlink" }
"~/.config/kakbr/window-keys" = { source = "dotfiles/config/kak/kakbr/window-keys", mode = "symlink" }
"~/.config/starship.toml" = { source = "dotfiles/config/starship.toml", mode = "symlink" }
"~/.config/broot/conf.hjson" = { source = "dotfiles/config/broot/conf.hjson", mode = "symlink" }
"~/.config/broot/verbs.hjson" = { source = "dotfiles/config/broot/verbs.hjson", mode = "symlink" }
"~/.config/broot/skins/*.hjson" = { source = "dotfiles/config/broot/skins/*.hjson", mode = "symlink" }
# Enter (verbs.hjson) and double-click (opener shims, on broot's PATH only) -> broot-open -> kak (kakbr's, or a kak pane in broot's tmux window)
"~/.local/bin/broot-open" = { source = "dotfiles/config/kak/scripts/broot-open", mode = "symlink" }
"~/.local/lib/broot-opener/wslview" = { source = "dotfiles/config/kak/scripts/broot-open", mode = "symlink" }
"~/.local/lib/broot-opener/xdg-open" = { source = "dotfiles/config/kak/scripts/broot-open", mode = "symlink" }
"~/.local/bin/kakbr-sidebar" = { source = "dotfiles/config/kak/scripts/kakbr-sidebar", mode = "symlink" }
"~/.local/bin/kakmux" = { source = "dotfiles/config/kak/scripts/kakmux", mode = "symlink" }
"~/.config/btop/btop.conf" = { source = "dotfiles/config/btop/btop.conf", mode = "copy" }
"~/.config/opencode/cli.json" = { source = "dotfiles/config/opencode/cli.json", mode = "copy" }

# Keys are not in this repo; copy them over by hand. These only fix permissions.
"~/.ssh" = { permissions = "0700" }
"~/.ssh/config" = { source = "dotfiles/ssh/config", mode = "copy", permissions = "0600" }
# whose signatures git trusts (gpg.ssh.allowedSignersFile): the github key's public half
"~/.ssh/allowed_signers" = { source = "dotfiles/ssh/allowed_signers", mode = "symlink" }
"~/.ssh/id_ed25519_github" = { permissions = "0600" }
"~/.ssh/id_ed25519_openwrt" = { permissions = "0600" }

# --- account -----------------------------------------------------------------

[bootstrap.user]
login_shell = "/usr/bin/zsh"
